name: Windows CUDA Portable Build

on:
  push:
    branches: [ dev, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ dev, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build-windows-portable:
    runs-on: windows-2022
    env:
      VCPKG_ROOT: ${{ github.workspace }}\..\vcpkg
      VCPKG_BUILD_TYPE: release
      CUDA_PATH: "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v12.8"
      BUILD_DIR: b
      SCCACHE_DIR: ${{ github.workspace }}\.sccache
      SCCACHE_CACHE_SIZE: "5G"

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: .sccache
          key: sccache-windows-${{ github.sha }}
          restore-keys: |
            sccache-windows-

      - name: Install CUDA 12.8
        run: |
          cd ..
          Invoke-WebRequest https://developer.download.nvidia.com/compute/cuda/12.8.0/local_installers/cuda_12.8.0_571.96_windows.exe -OutFile cuda.exe -Verbose
          Start-Process -FilePath .\cuda.exe -ArgumentList "-y -s -accepteula -toolkit -override -noDisplayDriver" -Wait

      - name: Set CUDA environment
        run: |
          echo "CUDA_PATH=C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "CUDA_PATH_V12_8=C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8\libnvvp" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Normalize vcpkg path
        run: '"VCPKG_ROOT=$([System.IO.Path]::GetFullPath($env:VCPKG_ROOT))" >> $env:GITHUB_ENV'

      - name: Cache vcpkg tool
        id: cache-vcpkg-tool
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_ROOT }}
          key: vcpkg-tool-${{ runner.os }}-2026-02-21
          restore-keys: vcpkg-tool-${{ runner.os }}-

      - name: Setup vcpkg
        if: steps.cache-vcpkg-tool.outputs.cache-hit != 'true'
        run: |
          cd ..
          git clone https://github.com/microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Cache vcpkg_installed
        uses: actions/cache@v6
        with:
          path: ${{ env.BUILD_DIR }}/vcpkg_installed
          key: vcpkg-installed-${{ runner.os }}-prebuilt-ort-v1-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.github/overlays/**') }}
          restore-keys: vcpkg-installed-${{ runner.os }}-prebuilt-ort-v1-

      - name: Configure CMake for All GPU Architectures
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -B %BUILD_DIR% -S . -G Ninja ^
            -DCMAKE_C_COMPILER_LAUNCHER=sccache ^
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache ^
            -DCMAKE_CUDA_COMPILER_LAUNCHER=sccache ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DLFS_FAST_COMPILE=OFF ^
            -DCMAKE_CUDA_ARCHITECTURES="75;80;86;89;90;90a" ^
            -DBUILD_PORTABLE=ON ^
            -DBUILD_PYTHON_STUBS=OFF ^
            -DLFS_DEV_IMPORT_SOURCE_PYTHON=OFF ^
            -DLFS_DEV_IMPORT_SOURCE_RESOURCES=OFF

      - name: Build Portable Binaries
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          set PATH=%CD%\%BUILD_DIR%;%CD%\%BUILD_DIR%\vcpkg_installed\x64-windows\bin;%PATH%
          cmake --build %BUILD_DIR% -j %NUMBER_OF_PROCESSORS%

      - name: Print sccache stats
        run: sccache --show-stats

      - name: Prepare Portable Staging Directory
        shell: pwsh
        run: |
          $staging = "LichtFeld-Studio-Portable"
          New-Item -ItemType Directory -Force -Path $staging
          New-Item -ItemType Directory -Force -Path "$staging\assets"

          # 1. Copy executables, DLLs, and compile Python extensions
          Copy-Item -Path "$env:BUILD_DIR\*.exe" -Destination $staging -ErrorAction SilentlyContinue
          Copy-Item -Path "$env:BUILD_DIR\*.dll" -Destination $staging -ErrorAction SilentlyContinue
          
          $pydFiles = Get-ChildItem -Path $env:BUILD_DIR -Filter "*.pyd" -Recurse
          $pydFiles | Copy-Item -Destination $staging -Force

          # 2. Copy the ENTIRE src directory and map Python .pyd dependencies
          if (Test-Path "src") {
            New-Item -ItemType Directory -Force -Path "$staging\src" -ErrorAction SilentlyContinue
            Copy-Item -Path "src\*" -Destination "$staging\src" -Recurse -Force
            
            # Place compiled .pyd extensions directly inside Python module folders so imports don't fail
            if (Test-Path "$staging\src\python") {
              $pydFiles | Copy-Item -Destination "$staging\src\python" -Force
            }
            if (Test-Path "$staging\src\python\lichtfeld") {
              $pydFiles | Copy-Item -Destination "$staging\src\python\lichtfeld" -Force
            }
          }

          # 3. Merge known asset paths into the root 'assets' folder
          $asset_paths = @(
            "$env:BUILD_DIR\assets\*",
            "$env:BUILD_DIR\src\visualizer\resources\assets\*",
            "src\visualizer\resources\assets\*",
            "src\visualizer\gui\assets\*",
            "src\visualizer\gui\resources\assets\*"
          )
          foreach ($path in $asset_paths) {
            $basePath = $path.TrimEnd('\*')
            if (Test-Path $basePath) {
              Copy-Item -Path $path -Destination "$staging\assets" -Recurse -Force
            }
          }

          # 4. Explicitly copy locales folder to the ROOT directory
          $locale_paths = @(
            "$env:BUILD_DIR\locales",
            "locales",
            "src\visualizer\resources\locales",
            "src\visualizer\gui\locales",
            "src\visualizer\gui\resources\locales"
          )
          foreach ($path in $locale_paths) {
            if (Test-Path $path) {
              Copy-Item -Path $path -Destination "$staging\locales" -Recurse -Force
            }
          }

          # 5. Locate and copy locale_index.json to the ROOT directory
          $locale_indexes = @(
            "$env:BUILD_DIR\locale_index.json",
            "locale_index.json",
            "src\visualizer\resources\locale_index.json",
            "src\visualizer\gui\locales\locale_index.json",
            "src\visualizer\gui\resources\locales\locale_index.json"
          )
          foreach ($path in $locale_indexes) {
            if (Test-Path $path) {
              Copy-Item -Path $path -Destination "$staging\locale_index.json" -Force
            }
          }

          # 6. Bundle embedded Python Standard Library (Lib & DLLs)
          $pythonToolDir = "$env:BUILD_DIR\vcpkg_installed\x64-windows\tools\python3"
          if (Test-Path $pythonToolDir) {
            if (Test-Path "$pythonToolDir\Lib") {
              New-Item -ItemType Directory -Force -Path "$staging\Lib" -ErrorAction SilentlyContinue
              Copy-Item -Path "$pythonToolDir\Lib\*" -Destination "$staging\Lib" -Recurse -Force
            }
            if (Test-Path "$pythonToolDir\DLLs") {
              New-Item -ItemType Directory -Force -Path "$staging\DLLs" -ErrorAction SilentlyContinue
              Copy-Item -Path "$pythonToolDir\DLLs\*" -Destination "$staging\DLLs" -Recurse -Force
            }
            Copy-Item -Path "$pythonToolDir\*.zip" -Destination $staging -ErrorAction SilentlyContinue
          }

          # 7. Copy vcpkg dynamic dependencies
          if (Test-Path "$env:BUILD_DIR\vcpkg_installed\x64-windows\bin") {
            Copy-Item -Path "$env:BUILD_DIR\vcpkg_installed\x64-windows\bin\*.dll" -Destination $staging -ErrorAction SilentlyContinue
            Copy-Item -Path "$env:BUILD_DIR\vcpkg_installed\x64-windows\bin\*.zip" -Destination $staging -ErrorAction SilentlyContinue
            Copy-Item -Path "$env:BUILD_DIR\vcpkg_installed\x64-windows\bin\*._pth" -Destination $staging -ErrorAction SilentlyContinue
          }

          # 8. Copy compiled extensions/plugins
          if (Test-Path "$env:BUILD_DIR\extensions") {
            Copy-Item -Path "$env:BUILD_DIR\extensions" -Destination $staging -Recurse -Force
          }

          # 9. Copy CUDA runtime libraries
          $cudaBin = "$env:CUDA_PATH\bin"
          $cudaDlls = @("cudart64_*.dll", "cublas64_*.dll", "cublasLt64_*.dll", "cusparse64_*.dll", "curand64_*.dll", "nvjpeg64_*.dll")
          foreach ($dllPattern in $cudaDlls) {
            Get-ChildItem -Path $cudaBin -Filter $dllPattern | Copy-Item -Destination $staging -Force
          }

      - name: Upload Portable Directory Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LichtFeld-Studio-Windows-Portable-x64
          path: LichtFeld-Studio-Portable/
